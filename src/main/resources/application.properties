spring.application.name=First-MCP-Server

spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Synchronous or Asynchronous communication
spring.ai.mcp.server.type=SYNC

# Simple Standard Input/Output communication (not WebSocket or SSE)
spring.ai.mcp.server.stdio=true

# Name that will be displayed in MCP client
spring.ai.mcp.server.name=user-mcp-server

spring.ai.mcp.server.version=1.0.0

spring.main.web-application-type=none
spring.main.banner-mode=off
logging.pattern.console=